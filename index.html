<DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset= "UTF-8">
    <meta name="viewport"
content="width=device-width,
initial-scale=1.0">
    <title>Sistema de notas</title>

    <link rel="stylesheet"
 href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">
        <div class="logo">
            <span>SA</span>
        </div>
        <h1>Sistema de Avaliação</h1>

        <p class="subtitulo">Gestão de desempenho acadêmico</p> 

        <p>Preencha os dados do aluno abaixo</p>

        <form id="formAluno">
    <div>
            <label for="nome"> Nome do aluno: </label>
            <input
                type="text"
                id="nome"
                placeholder="Digite o nome do aluno"
                 >
    </div>

    <div>
            <label for="nota1">Primeira nota:</label>
            <input
                type="number"
                id="nota1"
                min="0"
                max="10"
                step="0.01"
                placeholder="Digite a primeira nota"
                >
    </div>

    <div>
            <label
for="nota2">Segunda nota: </label>
             <input
                type="number"
                id="nota2"
                min="0"
                max="10"
                step="0.01"
                placeholder="Digite a segunda nota"

                    >
    </div>

    <div>
            <button type="button" id="btnMedia">
                MÉDIA
            </button>
                    
            <button type="button" id="btnSituacao">
                SITUAÇÃO
            </button>
            
            <button type="button" id="btnLimpar">
                LIMPAR
            </button>

    </div>
        </form>
        <p id= "mensagemErro"></p>
        <div id="resultado">
            <h2>Resultado do aluno</h2>
            <p>Nome do aluno: <span id="resultadoNome">---</span></p>
            <p>Média obtida: <span id="resultadoMedia">---</span></p>
            <p>Situação: <span id="resultadoSituacao">---</span></p>
        </div>
    </div>

    <div class="link-data">
        <a href="data-hora.html">Consultar data e hora</a>
        
</div>           
</body>
</html>
