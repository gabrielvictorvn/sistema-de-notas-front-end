<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de notas</title>
    <link rel="stylesheet"
href="login.css">
    <script src="login.js" defer></script>
</head>

<body>
    <h1>Área de Login</h1>
    <form id="formLogin">
        <label>Usuário: </label>
        <input type="text" id="usuario"
placeholder="Digite seu usuário">
        <label>Senha</label>
        <input type="password"
id="senha" placeholder="Digite sua senha:">
        <button type="submit">Entrar</button>

    </form>
    
    <p id="mensagem"></p>
    
</body>
</html>
